name: Synesthesia
options:
  bundleIdPrefix: com.synesthesia
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: false

targets:
  Synesthesia:
    type: application
    platform: iOS
    sources:
      - path: Synesthesia
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Synesthesia/Resources/Assets.xcassets
    info:
      path: Synesthesia/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.synesthesia.app
        INFOPLIST_FILE: Synesthesia/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: true
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: true
